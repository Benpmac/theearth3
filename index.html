<!doctype html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>TheEarth</title>
  <meta name="description" content="Visitez un pays depuis votre canapé : un globe interactif et une page complète pour chaque pays du monde.">
  <meta name="theme-color" content="#0A1024">
  <meta name="color-scheme" content="dark">
  <!-- Mode sombre par défaut ; mode clair seulement si la personne l'a choisi (bouton soleil/lune).
       Appliqué ici, avant les styles, pour qu'aucune page ne s'affiche d'abord dans le mauvais mode. -->
  <script>
    try {
      if (localStorage.getItem("theme") === "light") {
        document.documentElement.dataset.theme = "light";
        document.querySelector('meta[name="color-scheme"]').content = "light";
      }
    } catch (e) { /* stockage indisponible : on reste en sombre */ }
  </script>

       le texte courant en Inter. crossorigin est obligatoire, même sur le même domaine,

  <link rel="preload" href="polices/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>

  <!-- ============ Barre du haut : logo, navigation, recherche ============ -->
  <header class="topbar">

  <main id="main" tabindex="-1">
    <!-- ============ Écran 1 : le globe ============ -->
    <section class="page page--explore" data-page="explore" aria-labelledby="explore-title">
      <h1 class="visually-hidden" id="explore-title">Explorer la Terre</h1>
      <div class="explore__bar">
        <p class="explore__intro"><strong>Où partir aujourd’hui ?</strong> <span class="explore__how">Touche un pays pour ouvrir sa page.</span></p>
        <p class="explore__facts" data-planet-facts></p>
      </div>
      <div class="globe">
        <canvas class="globe__canvas" role="img" aria-label="Globe terrestre interactif. Au clavier, utilise la recherche en haut de la page pour choisir un pays."></canvas>
        <div class="globe__tooltip" hidden></div>
        <div class="legend" aria-live="polite"></div>
        <div class="globe__controls" role="group" aria-label="Zoom du globe">
          <button class="globe__btn" type="button" data-zoom="in" aria-label="Zoomer"><svg class="icon" aria-hidden="true"><use href="#i-plus"/></svg></button>
          <button class="globe__btn" type="button" data-zoom="out" aria-label="Dézoomer"><svg class="icon" aria-hidden="true"><use href="#i-minus"/></svg></button>
          <button class="globe__btn" type="button" data-zoom="reset" aria-label="Revenir à la vue d'ensemble"><svg class="icon" aria-hidden="true"><use href="#i-reset"/></svg></button>
        </div>
        <p class="globe__hint">Glisse pour faire tourner · pince ou molette pour zoomer · touche un pays pour le visiter</p>
        <div class="loader" id="loader" role="status">
          <span class="loader__ring" aria-hidden="true"></span>
          <span class="loader__text">Chargement de la planète…</span>
        </div>
      </div>
    </section>

    <!-- ============ Écran 2 : la page d'un pays (remplie par CountryPage) ============ -->
    <article class="page page--country" data-page="country" hidden></article>

    <!-- ============ Écran 3 : toutes les destinations (remplie par DestinationsPage) ============ -->
    <section class="page page--destinations" data-page="destinations" hidden></section>

    <!-- ============ Écran 4 : « Ton avis », le formulaire de suggestions (rempli par FeedbackPage) ============ -->
    <section class="page page--feedback" data-page="feedback" hidden></section>
  </main>

  <!-- Navigation du bas sur téléphone : les mêmes 4 rubriques qu'en haut sur ordinateur (la recherche reste en haut) -->
  <nav class="tabbar" aria-label="Navigation principale">
    <a href="#/" data-nav="explore"><svg class="icon" aria-hidden="true"><use href="#i-globe"/></svg><span>Globe</span></a>
    <a href="#/destinations" data-nav="destinations"><svg class="icon" aria-hidden="true"><use href="#i-compass"/></svg><span>Destinations</span></a>
    <a href="#/hasard" data-nav="random"><svg class="icon" aria-hidden="true"><use href="#i-dice"/></svg><span>Au hasard</span></a>
    <a href="#/avis" data-nav="feedback"><svg class="icon" aria-hidden="true"><use href="#i-chat"/></svg><span>Ton avis</span></a>
  </nav>

  <!-- Garde-fou : un petit script "classique" qui tourne même quand les modules JavaScript
       ne peuvent pas se charger, pour expliquer le problème au lieu d'afficher un chargement sans fin -->
  <script>
    (function () {
      var loader = document.getElementById("loader");
      var text = loader.querySelector(".loader__text");
      function fail(message) {
        loader.classList.add("is-error");
        text.textContent = message;
      }
      // Ouvert par un double-clic : le navigateur bloque les modules et les fichiers de données
      if (location.protocol === "file:") {
        fail("Le site doit être ouvert avec un petit serveur local, pas par un double-clic sur index.html. Dans VS Code : clic droit sur index.html, puis « Open with Live Server » (le README donne d’autres façons).");
        return;
      }
      // Toujours en chargement après 25 s : quelque chose bloque
      setTimeout(function () {
        if (document.body.classList.contains("is-loading") && !loader.classList.contains("is-error")) {
          fail("Le chargement prend plus de temps que prévu. Vérifie ta connexion puis recharge la page. Si rien ne change, ouvre la console (F12) pour lire l'erreur.");
        }
      }, 25000);
    })();
  </script>
